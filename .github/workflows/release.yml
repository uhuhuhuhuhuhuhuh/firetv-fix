name: Build and publish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Resolve app version
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Build signed debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FireTV-Software-Volume.apk
          sha256sum FireTV-Software-Volume.apk > FireTV-Software-Volume-SHA256.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              FireTV-Software-Volume.apk \
              FireTV-Software-Volume-SHA256.txt \
              --clobber
          else
            gh release create "$TAG" \
              FireTV-Software-Volume.apk \
              FireTV-Software-Volume-SHA256.txt \
              --target "$GITHUB_SHA" \
              --title "Fire TV Software Volume $TAG" \
              --notes "Adds 1 dB software-attenuation steps controlled by compatible Volume Up and Volume Down key events. Volume Down increases attenuation; Volume Up reduces attenuation. Includes an optional accessibility service for control over other apps. The APK is debug-signed for sideloading and requests no internet permission."
          fi

